id: 27
slug: per-capita-rank
title: Per-capita ranking
difficulty: medium
datasets: [emissions]
skills: [window, top-n]
prompt: |
  Rank countries (rows with an `iso_code`) with at least 10 million people by 2022 CO2
  per person (`co2_per_capita`), highest first, using a rank with no gaps after ties.

  Return the top ten as `rank`, `country` and `co2_per_capita` (tonnes, rounded to 2
  decimals), ordered by rank then country.
hints:
  - dense_rank() OVER (ORDER BY co2_per_capita DESC)
  - Drop NULL co2_per_capita, or NULLs sort first in descending order in some engines.
reference_sql: |
  SELECT dense_rank() OVER (ORDER BY co2_per_capita DESC) AS rank,
    country,
    round(co2_per_capita, 2) AS co2_per_capita
  FROM emissions
  WHERE year = 2022 AND iso_code IS NOT NULL AND population >= 10000000
    AND co2_per_capita IS NOT NULL
  QUALIFY rank <= 10
  ORDER BY rank, country
grading:
  ordered: true
  tolerance: 0.006
explanation: |
  rank() leaves gaps after ties (1, 1, 3), dense_rank() does not (1, 1, 2), row_number()
  breaks ties arbitrarily. Pick deliberately; "top 10" with rank() can return more than ten
  rows. The population filter keeps small oil states such as Qatar from filling the list.
